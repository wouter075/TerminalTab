name: Release

# Push a tag like v1.0.1 to build the Windows installer and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run make

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: TerminalTab-windows
          path: |
            out/make/squirrel.windows/x64/*
            out/make/zip/win32/x64/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          gh release create "$TAG" --title "TerminalTab $TAG" --generate-notes \
            out/make/squirrel.windows/x64/TerminalTab-Setup.exe \
            out/make/squirrel.windows/x64/RELEASES \
            out/make/squirrel.windows/x64/*.nupkg \
            out/make/zip/win32/x64/*.zip
