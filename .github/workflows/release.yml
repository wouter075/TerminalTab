name: Release

# Push a tag like v1.1.1 to build the Windows and Linux installers and publish them as a
# GitHub Release. "Run workflow" (manual) only builds; the files are kept as run artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run make
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            out/make/squirrel.windows/x64/*
            out/make/zip/win32/x64/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run make
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            out/make/deb/x64/*.deb
            out/make/rpm/x64/*.rpm

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          # Artifacts keep their out/make/... subfolders; release assets are flat.
          mapfile -t files < <(find dist -type f \( -name '*.exe' -o -name RELEASES -o -name '*.nupkg' \
            -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \))
          printf '%s\n' "${files[@]}"
          for ext in exe deb rpm; do
            printf '%s\n' "${files[@]}" | grep -q "\.$ext$" || { echo "::error::No .$ext built"; exit 1; }
          done
          gh release create "$TAG" --title "TerminalTab $TAG" --generate-notes "${files[@]}"
